# SQ-BHOI (R50vd): detection + body pose + hand-object interaction (OiH).
# Used for training (tools/train.py) and for evaluation / demo / export.
#
# Defaults reproduce the reference setting: global batch 128 = 16 images x 8 GPUs, 72 epochs.
#   torchrun --nproc_per_node=8 tools/train.py -c configs/sqbhoi_r50vd.yml
#
# Fewer GPUs: keep batch_size x #GPUs = 16 x k  (k = global batch / 16) and rescale the values below
# with the same rule that produced the reference values (k = 8):
#   ema.k                              k
#   optimizer.lr                       1e-4  * sqrt(k)   (reference 0.00028284)
#   optimizer.params[0,1].lr           1e-5  * sqrt(k)   (backbone, reference 0.000028284)
#   optimizer.betas                    [1 - 0.1 * k, 1 - 0.001 * k]   (reference [0.2, 0.992])
#   optimizer.eps                      1e-8  / sqrt(k)   (reference 0.0000000035355)
#   optimizer.weight_decay             1e-4  * sqrt(k)   (reference 0.000282817)
# Example, 2 GPUs x 8 images (global batch 16, k = 1):
#   torchrun --nproc_per_node=2 tools/train.py -c configs/sqbhoi_r50vd.yml \
#     -u train_dataloader.batch_size=8 ema.k=1 optimizer.lr=0.0001 optimizer.betas="[0.9, 0.999]" \
#        optimizer.eps=0.00000001 optimizer.weight_decay=0.0001
# (the per-group lr of `optimizer.params` has to be edited in configs/include/optimizer.yml.)
# `epoches` and the lr schedule are in epochs and do not depend on the batch size.

__include__: [
  './include/dataset.yml',
  './include/runtime.yml',
  './include/optimizer.yml',
  './include/sqbhoi_r50vd.yml',
]

output_dir: ./output/sqbhoi_r50vd
