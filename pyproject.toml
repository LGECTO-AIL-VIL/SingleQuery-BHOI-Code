[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["datasets", "weights", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # registry packages re-export with `import *`
"tools/*.py" = ["E402"]  # sys.path is extended before the `src` imports
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
